<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LifeOS - Acceso</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
:root{
  --bg:#020617;
  --panel:#0f172a;
  --panel-soft:#111827;
  --border:#1e293b;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --primary:#38bdf8;
  --primary-hover:#0ea5e9;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-card{
  width:100%;
  max-width:360px;
  background:linear-gradient(180deg,var(--panel),var(--panel-soft));
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px;
  text-align:center;
}

.login-card h1{
  margin:0 0 8px;
  font-size:22px;
}

.login-card p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:20px;
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#020617;
  border:2px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  margin:0 auto 16px;
}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
  margin-bottom:12px;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--primary);
  color:#020617;
  font-weight:600;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:var(--primary-hover);
}

.small{
  font-size:12px;
  color:var(--muted);
  margin-top:12px;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="avatar">
    <i class="bi bi-person-fill"></i>
  </div>

  <h1>LifeOS</h1>
  <p>Acceso personal</p>

  <input type="password" id="pin" placeholder="PIN o contraseña" autocomplete="current-password">

  <button onclick="login()">Entrar</button>

  <div class="small">
    Este sistema es solo para uso personal
  </div>
</div>

<script>
/*
  CONFIGURACIÓN INICIAL
  Cambia este PIN cuando quieras
*/
const DEFAULT_PIN = "1234";

/*
  Si ya hay sesión activa, entra directo a la página que venías
*/
const redirect = localStorage.getItem("lifeos_redirect") || "index.html";

if(localStorage.getItem("lifeos_logged") === "true"){
  window.location.href = redirect;
}

function login(){
  const pinInput = document.getElementById("pin").value;

  // Si no existe PIN guardado, se crea
  if(!localStorage.getItem("lifeos_pin")){
    localStorage.setItem("lifeos_pin", DEFAULT_PIN);
  }

  const savedPin = localStorage.getItem("lifeos_pin");

  if(pinInput === savedPin){
    localStorage.setItem("lifeos_logged","true");

    // Ir a la página que intentabas abrir
    const go = localStorage.getItem("lifeos_redirect") || "index.html";
    localStorage.removeItem("lifeos_redirect");

    window.location.href = go;
  }else{
    alert("PIN incorrecto");
  }
}

// (Opcional) Enter para enviar
document.getElementById("pin").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") login();
});
</script>

</body>
</html>
