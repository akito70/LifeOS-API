<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Health</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
  margin:0;
  height:100vh;
  background:linear-gradient(160deg,#74c69d,#40916c);
}
.screen{
  display:none;
  height:100vh;
  padding:20px;
}
.screen.active{
  display:flex;
  flex-direction:column;
}
h1,h2{text-align:center;color:#1b4332}
input,select,button{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:14px;
  border:none;
  font-size:16px;
}
button{
  background:linear-gradient(145deg,#2d6a4f,#1b4332);
  color:#fff;
  font-weight:bold;
}
.card{
  background:#ffffff;
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
}
#app{overflow-y:auto}
#plant{text-align:center;font-size:70px}
canvas{
  width:100%;
  height:180px;
  background:#f1f1f1;
  border-radius:14px;
}
ul{padding-left:18px}
li{margin-bottom:6px}
label{display:flex;gap:8px;align-items:center}
.motivation{text-align:center;font-style:italic;color:#2d6a4f}
header{text-align:center;font-weight:bold;margin-bottom:10px}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen" class="screen active">
  <h1>🌱 Green Health</h1>
  <input id="nameInput" placeholder="Nombre">
  <input id="weightInput" type="number" placeholder="Peso (kg)">
  <select id="statusInput">
    <option value="">Estado físico</option>
    <option value="bajo">Bajo peso</option>
    <option value="normal">Normal</option>
    <option value="sobre">Sobrepeso</option>
  </select>
  <button id="loginBtn">Iniciar sesión</button>
</section>

<!-- APP -->
<section id="appScreen" class="screen">
  <header id="userHeader"></header>

  <div class="card">
    <h2>Calculadora de huella de carbono</h2>
    <input id="kmInput" type="number" placeholder="Km diarios en transporte">
    <input id="energyInput" type="number" placeholder="kWh mensuales">
    <input id="meatInput" type="number" placeholder="Comidas con carne por semana">
    <button id="calcBtn">Calcular huella</button>
    <p><b>Huella mensual:</b> <span id="carbonResult">0</span> kg CO₂</p>
  </div>

  <div class="card">
    <h2>Progreso ecológico</h2>
    <div id="plant">🌱</div>
    <p>Nivel: <b id="levelSpan">1</b> | Puntos: <b id="pointsSpan">0</b></p>
    <p class="motivation" id="motivation"></p>
  </div>

  <div class="card">
    <h2>Evolución de la huella</h2>
    <canvas id="chartCanvas"></canvas>
  </div>

  <div class="card">
    <h2>Recomendaciones para reducir CO₂</h2>
    <ul id="tipsList"></ul>
  </div>

  <div class="card">
    <h2>Seguimiento de hábitos</h2>
    <ul id="habitsList"></ul>
  </div>
</section>

<script>
/* ================= ESTADO ================= */
let points = 0;
let level = 1;
let history = [];

const habits = {
  "Caminar o usar bicicleta": false,
  "Apagar luces innecesarias": false,
  "Reducir consumo de carne": false,
  "Desconectar cargadores": false,
  "Usar botellas reutilizables": false
};

/* ================= LOGIN ================= */
const loginScreen = document.getElementById("loginScreen");
const appScreen = document.getElementById("appScreen");
const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", () => {
  const name = document.getElementById("nameInput").value.trim();
  const weight = document.getElementById("weightInput").value;
  const status = document.getElementById("statusInput").value;

  if(!name || !weight || !status){
    alert("Completa todos los campos");
    return;
  }

  document.getElementById("userHeader").textContent =
    `👤 ${name} | ${weight}kg | ${status}`;

  loginScreen.classList.remove("active");
  appScreen.classList.add("active");

  renderHabits();
  updateProgress();
});

/* ================= CALCULO ================= */
document.getElementById("calcBtn").addEventListener("click", () => {
  const km = +document.getElementById("kmInput").value || 0;
  const energy = +document.getElementById("energyInput").value || 0;
  const meat = +document.getElementById("meatInput").value || 0;

  const total =
    (km * 0.21 * 30) +
    (energy * 0.4) +
    (meat * 7 * 5);

  document.getElementById("carbonResult").textContent = total.toFixed(1);

  const gain = total < 300 ? 30 : total < 450 ? 15 : 5;
  points += gain;
  level = Math.min(5, Math.floor(points / 60) + 1);

  history.push(total);

  generateTips(total, km, energy, meat);
  updateProgress();
  drawChart();
});

/* ================= PROGRESO ================= */
function updateProgress(){
  const plants = ["🌱","🌿","🌳","🌴","🌲"];
  document.getElementById("plant").textContent = plants[level-1];
  document.getElementById("pointsSpan").textContent = points;
  document.getElementById("levelSpan").textContent = level;

  const phrases = [
    "Cada pequeño cambio cuenta.",
    "Vas por buen camino.",
    "Tu impacto ya se nota.",
    "Estás ayudando al planeta.",
    "Ejemplo de vida sostenible."
  ];
  document.getElementById("motivation").textContent = phrases[level-1];
}

/* ================= RECOMENDACIONES ================= */
function generateTips(total, km, energy, meat){
  const tips = document.getElementById("tipsList");
  tips.innerHTML = "";

  if(km > 10) tips.innerHTML += "<li>Reduce el uso del auto, camina o usa bicicleta</li>";
  if(energy > 200) tips.innerHTML += "<li>Disminuye el consumo eléctrico en casa</li>";
  if(meat > 5) tips.innerHTML += "<li>Reducir carne baja mucho tu huella</li>";
  if(total < 300) tips.innerHTML += "<li>Excelente huella ecológica 🌍</li>";

  tips.innerHTML += "<li>Cumplir hábitos diarios acelera tu progreso</li>";
}

/* ================= GRAFICO ================= */
function drawChart(){
  const canvas = document.getElementById("chartCanvas");
  const ctx = canvas.getContext("2d");

  canvas.width = canvas.offsetWidth;
  canvas.height = 180;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(history.length < 2) return;

  const max = Math.max(...history);
  ctx.beginPath();

  history.forEach((v,i)=>{
    const x = i * (canvas.width / (history.length - 1));
    const y = canvas.height - (v / max * canvas.height);
    if(i === 0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });

  ctx.strokeStyle = "#2d6a4f";
  ctx.lineWidth = 3;
  ctx.stroke();
}

/* ================= HABITOS ================= */
function renderHabits(){
  const ul = document.getElementById("habitsList");
  ul.innerHTML = "";

  Object.keys(habits).forEach(habit=>{
    const li = document.createElement("li");
    li.innerHTML = `
      <label>
        <input type="checkbox">
        ${habit}
      </label>
    `;
    const checkbox = li.querySelector("input");
    checkbox.addEventListener("change", ()=>{
      if(!habits[habit]){
        points += 10;
        level = Math.min(5, Math.floor(points / 60) + 1);
      }
      habits[habit] = checkbox.checked;
      updateProgress();
    });
    ul.appendChild(li);
  });
}
</script>

</body>
</html>
