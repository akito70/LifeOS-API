<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Green Health</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
  margin:0;height:100vh;overflow:hidden;
  background:linear-gradient(160deg,#74c69d,#40916c);
}
.screen{display:none;height:100vh;padding:20px}
.screen.active{display:flex;flex-direction:column}
h1,h2{text-align:center}
input,select,button{
  width:100%;padding:12px;margin-bottom:10px;
  border-radius:14px;border:none;font-size:16px
}
button{
  background:linear-gradient(145deg,#2d6a4f,#1b4332);
  color:#fff;font-weight:bold
}
.card{
  background:linear-gradient(145deg,#fff,#e9f5ee);
  border-radius:20px;padding:15px;margin-bottom:15px;
  box-shadow:0 8px 20px rgba(0,0,0,.2)
}
#app{overflow-y:auto}
header{text-align:center;font-weight:bold;margin-bottom:10px}
#plant{text-align:center;font-size:70px}
canvas{width:100%;background:#fff;border-radius:14px}
ul{padding-left:18px} li{margin-bottom:6px}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login" class="screen active">
<h1>🌱 Green Health</h1>
<input id="name" placeholder="Nombre">
<input id="weight" type="number" placeholder="Peso (kg)">
<select id="status">
<option value="">Estado físico</option>
<option value="bajo">Bajo peso</option>
<option value="normal">Normal</option>
<option value="sobre">Sobrepeso</option>
</select>
<button onclick="login()">Iniciar sesión</button>
</section>

<!-- APP -->
<section id="app" class="screen">
<header id="user"></header>

<div class="card">
<h2>Calculadora de huella de carbono</h2>
<input type="number" id="km" placeholder="Km diarios en transporte">
<input type="number" id="energy" placeholder="kWh mensuales">
<input type="number" id="meat" placeholder="Comidas con carne por semana">
<button onclick="calculate()">Calcular</button>
<p><b>Resultado:</b> <span id="carbon">0</span> kg CO₂</p>
</div>

<div class="card">
<h2>Progreso ecológico</h2>
<div id="plant">🌱</div>
<p>Nivel: <b id="level">1</b></p>
<p>Puntos: <b id="points">0</b></p>
</div>

<div class="card">
<h2>Historial & evolución</h2>
<canvas id="chart" height="180"></canvas>
<ul id="history"></ul>
</div>

<div class="card">
<h2>Recomendaciones personalizadas</h2>
<ul id="tips"></ul>
</div>

<div class="card">
<h2>Hábitos & retos ecológicos</h2>
<ul id="habits"></ul>
<p id="training"></p>
</div>

</section>

<script>
let points=+localStorage.getItem("points")||0;
let level=+localStorage.getItem("level")||1;
let history=JSON.parse(localStorage.getItem("history")||"[]");

function login(){
  if(!name.value||!weight.value||!status.value) return;
  localStorage.setItem("user",JSON.stringify({
    name:name.value,weight:weight.value,status:status.value
  }));
  showApp();
}

function showApp(){
  loginScreen.classList.remove("active");
  appScreen.classList.add("active");
  const u=JSON.parse(localStorage.getItem("user"));
  userHeader.textContent=`👤 ${u.name} | ${u.weight}kg | ${u.status}`;
  refresh();
}

function calculate(){
  const total=(km.value*0.21*30)+(energy.value*0.4)+(meat.value*7*5);
  carbon.textContent=total.toFixed(1);

  const earn=total<300?30:total<450?15:5;
  points+=earn;
  level=Math.min(5,Math.floor(points/50)+1);

  history.push(total.toFixed(1));
  localStorage.setItem("points",points);
  localStorage.setItem("level",level);
  localStorage.setItem("history",JSON.stringify(history));

  updatePlant();
  updateTips(total);
  drawChart();
  renderHistory();
}

function updatePlant(){
  const plants=["🌱","🌿","🌳","🌴","🌲"];
  plant.textContent=plants[level-1];
  levelSpan.textContent=level;
  pointsSpan.textContent=points;
}

function updateTips(c){
  const u=JSON.parse(localStorage.getItem("user"));
  tips.innerHTML="";
  if(c>450){
    tips.innerHTML+="<li>Reduce uso del automóvil</li>";
    tips.innerHTML+="<li>Disminuye carne roja</li>";
  }else tips.innerHTML+="<li>Buen impacto ambiental 🌱</li>";

  if(u.status==="sobre")
    tips.innerHTML+="<li>Caminar 30 min diarios mejora salud y reduce CO₂</li>";
  if(u.status==="bajo")
    tips.innerHTML+="<li>Mejora nutrición con alimentos locales</li>";
}

function drawChart(){
  const ctx=chart.getContext("2d");
  ctx.clearRect(0,0,chart.width,chart.height);
  if(history.length<2) return;
  const max=Math.max(...history);
  ctx.beginPath();
  history.forEach((v,i)=>{
    const x=i*(chart.width/(history.length-1));
    const y=chart.height-(v/max*chart.height);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.strokeStyle="#2d6a4f";
  ctx.lineWidth=3;
  ctx.stroke();
}

function renderHistory(){
  historyList.innerHTML="";
  history.slice(-5).forEach(h=>{
    const li=document.createElement("li");
    li.textContent=h+" kg CO₂";
    historyList.appendChild(li);
  });
}

function refresh(){
  updatePlant();
  drawChart();
  renderHistory();
  habits.innerHTML="<li>Usar bicicleta</li><li>Apagar luces</li><li>Reducir plásticos</li>";
  training.textContent=level<3
    ?"Empieza con pequeños cambios diarios."
    :"Excelente progreso, mantén hábitos sostenibles.";
}

const name=document.getElementById("name"),
weight=document.getElementById("weight"),
status=document.getElementById("status"),
loginScreen=document.getElementById("login"),
appScreen=document.getElementById("app"),
userHeader=document.getElementById("user"),
km=document.getElementById("km"),
energy=document.getElementById("energy"),
meat=document.getElementById("meat"),
carbon=document.getElementById("carbon"),
plant=document.getElementById("plant"),
levelSpan=document.getElementById("level"),
pointsSpan=document.getElementById("points"),
chart=document.getElementById("chart"),
historyList=document.getElementById("history"),
tips=document.getElementById("tips"),
habits=document.getElementById("habits"),
training=document.getElementById("training");

window.onload=()=>{if(localStorage.getItem("user"))showApp();}
</script>

</body>
</html>
