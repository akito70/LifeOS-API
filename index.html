<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Rifa Día de la Madre</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      min-height:100vh;
      background:
      linear-gradient(135deg,#ff3d81,#ff76a8,#ffc1d6);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
      overflow-x:hidden;
    }

    .container{
      width:100%;
      max-width:1100px;
      background:rgba(255,255,255,0.95);
      backdrop-filter:blur(15px);
      border-radius:30px;
      padding:35px;
      box-shadow:
      0 15px 40px rgba(0,0,0,0.15);
      position:relative;
      overflow:hidden;
    }

    .container::before{
      content:'';
      position:absolute;
      width:250px;
      height:250px;
      background:rgba(255,255,255,0.2);
      border-radius:50%;
      top:-100px;
      right:-100px;
    }

    .container::after{
      content:'';
      position:absolute;
      width:200px;
      height:200px;
      background:rgba(255,255,255,0.15);
      border-radius:50%;
      bottom:-80px;
      left:-80px;
    }

    .header{
      text-align:center;
      margin-bottom:35px;
      position:relative;
      z-index:2;
    }

    .header h1{
      font-size:2.5rem;
      color:#d81b60;
      margin-bottom:10px;
      font-weight:700;
    }

    .header p{
      color:#666;
      font-size:15px;
    }

    .ticket-preview{
      background:
      linear-gradient(135deg,#ff4f8b,#d81b60);
      color:white;
      border-radius:25px;
      padding:25px;
      margin-bottom:30px;
      text-align:center;
      box-shadow:
      0 10px 25px rgba(216,27,96,0.3);
      position:relative;
      overflow:hidden;
    }

    .ticket-preview::before{
      content:'🎀';
      position:absolute;
      font-size:80px;
      opacity:0.12;
      right:15px;
      top:-10px;
    }

    .ticket-preview h2{
      font-size:16px;
      margin-bottom:8px;
      font-weight:400;
    }

    .ticket-number{
      font-size:3rem;
      font-weight:700;
      letter-spacing:3px;
    }

    form{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-bottom:35px;
      position:relative;
      z-index:2;
    }

    .full{
      grid-column:1/3;
    }

    .input-group{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    label{
      font-size:14px;
      color:#444;
      font-weight:600;
    }

    input{
      border:none;
      background:#f7f7f7;
      padding:15px;
      border-radius:15px;
      font-size:15px;
      outline:none;
      transition:0.3s;
    }

    input:focus{
      background:white;
      box-shadow:
      0 0 0 4px rgba(255,61,129,0.18);
      transform:translateY(-1px);
    }

    .btn{
      border:none;
      background:
      linear-gradient(135deg,#ff3d81,#d81b60);
      color:white;
      padding:16px;
      border-radius:18px;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:
      0 10px 25px rgba(216,27,96,0.3);
    }

    .table-container{
      overflow-x:auto;
      position:relative;
      z-index:2;
    }

    table{
      width:100%;
      border-collapse:collapse;
      overflow:hidden;
      border-radius:20px;
    }

    thead{
      background:
      linear-gradient(135deg,#ff4f8b,#d81b60);
      color:white;
    }

    th{
      padding:18px;
      font-size:14px;
      font-weight:600;
    }

    td{
      padding:16px;
      text-align:center;
      border-bottom:1px solid #f0f0f0;
      color:#444;
    }

    tbody tr{
      background:white;
      transition:0.2s;
    }

    tbody tr:hover{
      background:#fff1f6;
    }

    .delete-btn{
      border:none;
      background:#ff4d4d;
      color:white;
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      font-weight:500;
      transition:0.3s;
    }

    .delete-btn:hover{
      background:#d60000;
    }

    .footer{
      margin-top:25px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:15px;
    }

    .counter{
      color:#555;
      font-weight:600;
      font-size:15px;
    }

    .badge{
      background:#ffe0ec;
      color:#d81b60;
      padding:10px 18px;
      border-radius:50px;
      font-size:14px;
      font-weight:600;
    }

    @media(max-width:768px){

      .container{
        padding:22px;
      }

      form{
        grid-template-columns:1fr;
      }

      .full{
        grid-column:auto;
      }

      .header h1{
        font-size:2rem;
      }

      .ticket-number{
        font-size:2.3rem;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🌸 Rifa Día de la Madre 🌸</h1>
      <p>Sistema de registro de participantes</p>
    </div>

    <div class="ticket-preview">
      <h2>Próximo Número de Rifa</h2>
      <div class="ticket-number" id="nextNumber">
        #001
      </div>
    </div>

    <form id="rifaForm">

      <div class="input-group">
        <label>Nombre Completo</label>

        <input
          type="text"
          id="nombre"
          placeholder="Ingrese el nombre completo"
          required
        />
      </div>

      <div class="input-group">
        <label>Número de Teléfono</label>

        <input
          type="tel"
          id="telefono"
          placeholder="8888-8888"
          required
        />
      </div>

      <div class="input-group full">
        <label>Cédula</label>

        <input
          type="text"
          id="cedula"
          placeholder="Ingrese la cédula"
          required
        />
      </div>

      <button class="btn full" type="submit">
        Registrar Participante
      </button>

    </form>

    <div class="table-container">

      <table>

        <thead>
          <tr>
            <th>Rifa</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Cédula</th>
            <th>Acción</th>
          </tr>
        </thead>

        <tbody id="tablaParticipantes"></tbody>

      </table>

    </div>

    <div class="footer">

      <div class="counter" id="contador">
        Total participantes: 0
      </div>

      <div class="badge">
        🎟️ Sorteo Especial
      </div>

    </div>

  </div>

  <script>

    let participantes = JSON.parse(
      localStorage.getItem("participantes")
    ) || [];

    const form = document.getElementById("rifaForm");
    const tabla = document.getElementById("tablaParticipantes");
    const contador = document.getElementById("contador");
    const nextNumber = document.getElementById("nextNumber");

    actualizarNumero();
    mostrarParticipantes();

    form.addEventListener("submit", function(e){

      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const cedula = document.getElementById("cedula").value.trim();

      // Número automático
      const numero = participantes.length + 1;

      participantes.push({
        numero,
        nombre,
        telefono,
        cedula
      });

      localStorage.setItem(
        "participantes",
        JSON.stringify(participantes)
      );

      form.reset();

      mostrarParticipantes();
      actualizarNumero();

    });

    function mostrarParticipantes(){

      tabla.innerHTML = "";

      participantes.forEach((p, index) => {

        tabla.innerHTML += `

          <tr>

            <td>
              <strong>#${String(p.numero).padStart(3, '0')}</strong>
            </td>

            <td>${p.nombre}</td>

            <td>${p.telefono}</td>

            <td>${p.cedula}</td>

            <td>

              <button
                class="delete-btn"
                onclick="eliminarParticipante(${index})"
              >
                Eliminar
              </button>

            </td>

          </tr>

        `;

      });

      contador.innerHTML =
      `Total participantes: ${participantes.length}`;

    }

    function actualizarNumero(){

      const siguiente = participantes.length + 1;

      nextNumber.innerHTML =
      "#" + String(siguiente).padStart(3, '0');

    }

    function eliminarParticipante(index){

      participantes.splice(index,1);

      // Reorganizar números automáticamente
      participantes = participantes.map((p, i) => ({
        ...p,
        numero: i + 1
      }));

      localStorage.setItem(
        "participantes",
        JSON.stringify(participantes)
      );

      mostrarParticipantes();
      actualizarNumero();

    }

  </script>

</body>
</html>
