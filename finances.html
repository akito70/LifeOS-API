<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LifeOS - Finanzas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#020617;
  --panel:#0f172a;
  --panel-soft:#0e1724;
  --border:#1e293b;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --primary:#38bdf8;
  --primary-hover:#0ea5e9;
  --green:#22c55e;
  --yellow:#facc15;
  --red:#ef4444;
  --income:#38bdf8; /* azul para ingresos */
  --expense:#ef4444; /* rojo para gastos */
}

/* Reset y tipografía */
*{ box-sizing:border-box; }
body{ margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }

/* Header */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  background:linear-gradient(180deg,var(--panel),var(--panel-soft));
  border-bottom:1px solid var(--border);
}

.header h1{ font-size:20px; margin:0; }
.header button{
  background:none; border:none; color:var(--text); font-size:20px;
}

/* Container principal */
.container{ padding:16px; display:grid; gap:20px; }

/* Secciones */
.section{
  background:linear-gradient(180deg,var(--panel),var(--panel-soft));
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
}

/* Títulos secciones */
.section h2{ margin-top:0; font-size:18px; }

/* Fondos totales */
.funds{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.fund-card{
  flex:1;
  min-width:140px;
  background:linear-gradient(180deg,#111827,#0f172a);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  text-align:center;
}

.fund-card h3{ margin:0 0 4px; font-size:14px; color:var(--muted); }
.fund-card strong{ font-size:22px; }

/* Form registro */
.form-group{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.form-group input, .form-group select{
  padding:10px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  flex:1;
}

.form-group button{
  padding:10px 16px;
  border:none;
  border-radius:12px;
  background:var(--primary);
  color:#020617;
  cursor:pointer;
}

.form-group button:hover{ background:var(--primary-hover); }

/* Tabla movimientos y cuentas */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}

th, td{
  padding:8px;
  text-align:left;
  border-bottom:1px solid var(--border);
  font-size:14px;
}

th{ color:var(--muted); }

.delete-btn{
  background:none;
  border:none;
  color:var(--red);
  cursor:pointer;
  font-size:16px;
}

/* Colores para categorías */
.category-color{
  display:inline-block;
  width:12px; height:12px;
  border-radius:50%;
  margin-right:4px;
}

/* Responsive */
@media(max-width:800px){
  .funds{ flex-direction:column; }
  .charts{ flex-direction:column; }
}
</style>
</head>
<body>
<script>
(function(){
  if (sessionStorage.getItem("lifeos_logged") !== "true") {
    const page = location.pathname.split("/").pop();
    sessionStorage.setItem("lifeos_redirect", page);
    location.replace("login.html");
  }
})();
</script>

<script>
if(localStorage.getItem("lifeos_logged") !== "true"){
  location.href="login.html";
}
</script>

<div class="header">
  <button onclick="location.href='index.html'"><i class="bi bi-arrow-left"></i></button>
  <h1>Finanzas</h1>
  <div></div>
</div>

<div class="container">

  <!-- Fondos -->
  <div class="section">
    <h2>Fondos</h2>
    <div class="funds">
      <div class="fund-card">
        <h3>Efectivo</h3>
        <strong id="totalCash">$0.00 / C$0.00</strong>
      </div>
      <div class="fund-card">
        <h3>Cuentas</h3>
        <strong id="totalAccounts">$0.00 / C$0.00</strong>
      </div>
    </div>
  </div>

  <!-- Registro de movimientos -->
  <div class="section">
    <h2>Agregar Movimiento</h2>
    <div class="form-group">
      <input type="number" id="amount" placeholder="Cantidad">
      <select id="currency">
        <option value="USD">USD</option>
        <option value="C">C$</option>
      </select>
      <select id="type">
        <option value="income">Ingreso</option>
        <option value="expense">Gasto</option>
        <option value="debt">Deuda</option>
        <option value="saving">Ahorro</option>
      </select>
      <select id="category">
        <option value="Personal">Personal</option>
        <option value="Transporte">Transporte</option>
        <option value="Deudas">Deudas</option>
        <option value="Diversión">Diversión</option>
        <option value="Ahorro">Ahorro</option>
      </select>
      <select id="accountSelect"></select>
      <button onclick="addMovement()">Agregar</button>
    </div>

    <table>
      <thead>
        <tr><th>Fecha</th><th>Cuenta</th><th>Categoría</th><th>Tipo</th><th>Monto</th><th>Acción</th></tr>
      </thead>
      <tbody id="movementsList"></tbody>
    </table>
  </div>

  <!-- Cuentas y Tarjetas -->
  <div class="section">
    <h2>Cuentas y Tarjetas</h2>
    <table>
      <thead>
        <tr><th>Nombre</th><th>Moneda</th><th>Saldo</th></tr>
      </thead>
      <tbody id="accountsList"></tbody>
    </table>
  </div>

  <!-- Gráficos -->
  <div class="section">
    <h2>Resumen</h2>
    <div class="charts">
      <canvas id="pieChart"></canvas>
      <canvas id="barChart"></canvas>
    </div>
  </div>

</div>

<script>
let movements = JSON.parse(localStorage.getItem("lifeos_finances")) || [];
let accounts = JSON.parse(localStorage.getItem("lifeos_accounts")) || [
  {name:'Bampro', currency:'C', balance:0},
  {name:'La FISE USD', currency:'USD', balance:0},
  {name:'La FISE C', currency:'C', balance:0}
];

const categoryColors={
  'Personal':'#38bdf8',
  'Transporte':'#facc15',
  'Deudas':'#ef4444',
  'Diversión':'#22c55e',
  'Ahorro':'#a78bfa'
};

function save(){
  localStorage.setItem("lifeos_finances", JSON.stringify(movements));
  localStorage.setItem("lifeos_accounts", JSON.stringify(accounts));
}

function updateAccountSelect(){
  const select = document.getElementById("accountSelect");
  select.innerHTML = `<option value="cash">Efectivo</option>`;
  accounts.forEach((a,i)=>{
    select.innerHTML += `<option value="${i}">${a.name} (${a.currency==='USD'?'$':'C$'}${a.balance.toFixed(2)})</option>`;
  });
}

function calculateTotals(){
  let cashUSD=0, cashC=0;
  let accUSD=0, accC=0;
  
  movements.forEach(m=>{
    if(m.account==='cash'){
      if(m.currency==='USD' && (m.type==='income'||m.type==='saving')) cashUSD+=m.amount;
      else if(m.currency==='USD') cashUSD-=m.amount;
      if(m.currency==='C' && (m.type==='income'||m.type==='saving')) cashC+=m.amount;
      else if(m.currency==='C') cashC-=m.amount;
    }
  });
  
  accounts.forEach(a=>{
    if(a.currency==='USD') accUSD+=a.balance;
    else accC+=a.balance;
  });
  
  document.getElementById("totalCash").textContent = `$${cashUSD.toFixed(2)} / C$${cashC.toFixed(2)}`;
  document.getElementById("totalAccounts").textContent = `$${accUSD.toFixed(2)} / C$${accC.toFixed(2)}`;
}

function renderMovements(){
  const tbody = document.getElementById("movementsList");
  tbody.innerHTML="";
  movements.slice().reverse().forEach((m,index)=>{
    const accName = m.account==='cash' ? 'Efectivo' : accounts[m.account].name;
    let amountColor = (m.type==='income'||m.type==='saving') ? 'var(--income)' : 'var(--expense)';

    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${m.date}</td>
                    <td>${accName}</td>
                    <td><span class="category-color" style="background:${categoryColors[m.category]}"></span>${m.category}</td>
                    <td>${m.type}</td>
                    <td style="color:${amountColor}">${m.currency==='USD'?'$':'C$'}${m.amount.toFixed(2)}</td>
                    <td><button class="delete-btn" onclick="deleteMovement(${index})"><i class="bi bi-trash"></i></button></td>`;
    tbody.appendChild(tr);
  });
}

function renderAccounts(){
  const tbody = document.getElementById("accountsList");
  tbody.innerHTML="";
  accounts.slice().reverse().forEach((a)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${a.name}</td><td>${a.currency}</td><td>${a.currency==='USD'?'$':'C$'}${a.balance.toFixed(2)}</td>`;
    tbody.appendChild(tr);
  });
}

function addMovement(){
  const amount = parseFloat(document.getElementById("amount").value);
  const currency = document.getElementById("currency").value;
  const type = document.getElementById("type").value;
  const category = document.getElementById("category").value;
  const account = document.getElementById("accountSelect").value;
  if(isNaN(amount) || amount <= 0) return alert("Cantidad inválida");

  if(account !== 'cash'){
    const accIndex = parseInt(account);
    if(type==='income'||type==='saving') accounts[accIndex].balance += amount;
    else accounts[accIndex].balance -= amount;
  }

  movements.push({amount, currency, type, category, account, date:new Date().toLocaleDateString()});
  document.getElementById("amount").value="";
  save();
  renderAll();
}

function deleteMovement(index){
  const m = movements[index];
  if(confirm("¿Eliminar este movimiento?")){
    if(m.account !== 'cash'){
      const accIndex = parseInt(m.account);
      if(m.type==='income'||m.type==='saving') accounts[accIndex].balance -= m.amount;
      else accounts[accIndex].balance += m.amount;
    }
    movements.splice(index,1);
    save();
    renderAll();
  }
}

let pieChart, barChart;
function renderCharts(){
  const totalsMap={};
  const colorsMap={};

  movements.forEach(m=>{
    const key = `${m.category} (${m.type})`;
    if(!totalsMap[key]) totalsMap[key]=0;
    if(m.type==='income'||m.type==='saving') totalsMap[key]+=m.amount;
    else totalsMap[key]+=m.amount; // gastos siguen sumando pero color rojo
    colorsMap[key]=(m.type==='income'||m.type==='saving') ? categoryColors[m.category] : 'var(--expense)';
  });

  const labels = Object.keys(totalsMap);
  const data = Object.values(totalsMap);
  const colors = labels.map(l=>colorsMap[l]);

  if(pieChart) pieChart.destroy();
  pieChart=new Chart(document.getElementById("pieChart").getContext("2d"),{
    type:'pie',
    data:{ labels, datasets:[{ data, backgroundColor:colors }] }
  });

  if(barChart) barChart.destroy();
  barChart=new Chart(document.getElementById("barChart").getContext("2d"),{
    type:'bar',
    data:{ labels, datasets:[{ label:'Gastos/Ingresos', data, backgroundColor:colors }] },
    options:{ scales:{ y:{ beginAtZero:true } } }
  });
}

function renderAll(){
  updateAccountSelect();
  calculateTotals();
  renderMovements();
  renderAccounts();
  renderCharts();
}

renderAll();
</script>

</body>
</html>
